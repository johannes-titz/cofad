on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # ubuntu-latest (24.04) has intermittently hung in setup-r while its
    # Azure apt mirror is unavailable. Use the stable runner explicitly.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CI: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
          needs: coverage

      - name: Run in-process coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests", quiet = FALSE)
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")

      - uses: codecov/codecov-action@v7
        if: github.event_name == 'push'
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          plugins: noop
          disable_search: true
          use_oidc: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: ignore
          retention-days: 14
