on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: deploy-shinylive

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest (24.04) has intermittently hung in setup-r while its
    # Azure apt mirror is unavailable. Use the stable runner explicitly.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          install-r: false
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::shinylive
          dependencies: '"hard"'
          install-pandoc: false
          install-quarto: false

      - name: Build Shinylive/webR site
        run: Rscript tools/build-shinylive.R

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
